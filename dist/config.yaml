# peon configuration. See SPEC.md §10.
# This file and the secret files it names are root-owned and 0600.
# Parsing is strict: unknown or duplicate keys are errors.
# Validate with: peon check-config

# Must match the host name agents use in "/run <host>".
host: CHANGEME

forgejo:
  url: https://forgejo.internal
  repos:
    - owner/repo
  # Numeric Forgejo user IDs, not usernames.
  bot_user_id: 0        # the shared peon bot account (same on every host)
  bot_token_file: /etc/peon/forgejo.token
  approver_id: 0        # your account
  requester_ids: []     # agent accounts allowed to propose jobs

# Who jobs may run as. Agents pick one with "/run <host> --user=<name>".
# Non-root users run in their own systemd user manager (rootless podman,
# systemctl --user) and need lingering: loginctl enable-linger <name>
jobs:
  default_user: root
  allowed_users:
    - root

# Durations are strings such as 30m, 2h or 10s. Bare numbers are rejected.
limits:
  job_ttl: 30m
  default_timeout: 10m
  max_timeout: 2h
  max_command_bytes: 4096
  output_tail_lines: 50
  poll_interval: 10s

loki:
  url: https://loki.internal
  user: peon-CHANGEME
  password_file: /etc/peon/loki.password

grafana:
  explore_url: https://grafana.internal/explore
  # Optional: UID of the Loki datasource, for direct links to a job's logs.
  # loki_datasource_uid: P8E80F9AEF21F6940
